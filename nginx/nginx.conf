events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    upstream backend_servers {
        server backend:8000;
    }

    upstream frontend_servers {
        server frontend:5173;
    }

    server {
        listen 80;
        server_name localhost;

        # Add security headers (Layer 8) at the load balancer level
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-XSS-Protection "1; mode=block";
        add_header X-Content-Type-Options "nosniff";

        # Forward API requests to FastAPI Backend
        location /api/ {
            proxy_pass http://backend_servers/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Forward OpenAPI Docs to FastAPI Backend
        location /docs {
            proxy_pass http://backend_servers/docs;
            proxy_set_header Host $host;
        }
        location /openapi.json {
            proxy_pass http://backend_servers/openapi.json;
            proxy_set_header Host $host;
        }

        # Forward all other requests to the Vite Frontend (including WebSocket for HMR)
        location / {
            proxy_pass http://frontend_servers;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }
    }
}
